<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="theme-color" content="#5b2c83">
  <title>Rafif Gak Boleh Nakal</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <header>
      <div class="logo">🎮</div>
      <h1>Rafif Gak Boleh Nakal</h1>
      <p class="subtitle">Main yang jujur ya... jangan nakal! 😄</p>
    </header>

    <section id="menuScreen" class="screen active">
      <div class="card">
        <h2>Pilih Mode</h2>
        <button class="big-btn" onclick="chooseMode('ai')">🤖 <span><b>1 PLAYER</b><small>Melawan Komputer</small></span></button>
        <button class="big-btn" onclick="chooseMode('two')">👥 <span><b>2 PLAYER</b><small>Bermain Berdua</small></span></button>
      </div>

      <div class="card">
        <h2>Pilih Ukuran Papan</h2>
        <div class="sizes">
          <button onclick="chooseSize(3)" class="size selected">3 × 3</button>
          <button onclick="chooseSize(4)" class="size">4 × 4</button>
          <button onclick="chooseSize(5)" class="size">5 × 5</button>
          <button onclick="chooseSize(6)" class="size">6 × 6</button>
          <button onclick="chooseSize(7)" class="size">7 × 7</button>
        </div>
      </div>

      <button class="start-btn" onclick="startGame()">▶ MULAI BERMAIN</button>
    </section>

    <section id="gameScreen" class="screen">
      <div class="topbar">
        <button class="icon-btn" onclick="goMenu()">⌂</button>
        <div id="status" class="status">Giliran: ❌</div>
        <button class="icon-btn" onclick="restartGame()">↻</button>
      </div>

      <div id="board" class="board"></div>

      <div class="legend">
        <span>❌ <b id="xName">Player 1</b></span>
        <span>⭕ <b id="oName">Player 2</b></span>
      </div>
    </section>

    <div id="resultModal" class="modal">
      <div class="result-box">
        <div id="resultEmoji" class="result-emoji">🥳😊</div>
        <h2 id="resultTitle">MENANG!</h2>
        <p id="resultText"></p>
        <button class="start-btn" onclick="restartGame()">🔄 MAIN LAGI</button>
        <button class="menu-btn" onclick="goMenu()">🏠 KEMBALI KE MENU</button>
      </div>
    </div>

    <footer>💙 Rafif Gak Boleh Nakal 💙</footer>
  </main>
  <script src="game.js"></script>
</body>
</html>
