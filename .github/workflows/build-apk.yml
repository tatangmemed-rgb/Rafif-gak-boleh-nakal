name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]
    paths-ignore:
      - "apk/**"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Add Android platform
        run: |
          npx cap add android || true
          npx cap sync android

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Build debug APK
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleDebug

      - name: Copy APK to repository
        run: |
          mkdir -p apk
          cp android/app/build/outputs/apk/debug/app-debug.apk apk/Rafif-Gak-Boleh-Nakal.apk

      - name: Commit APK to repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apk/Rafif-Gak-Boleh-Nakal.apk
          git diff --cached --quiet || git commit -m "Update Android APK"
          git push

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Rafif-Gak-Boleh-Nakal-APK
          path: apk/Rafif-Gak-Boleh-Nakal.apk
